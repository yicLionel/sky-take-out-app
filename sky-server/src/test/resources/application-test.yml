spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:sky_take_out;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true

sky:
  jwt:
    secret: sky-take-out-test-secret
    ttl-seconds: 604800
