server:
  port: ${PORT:8080}

spring:
  application:
    name: sky-take-out-mvp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQLHOST:mysql.railway.internal}:${MYSQLPORT:3306}/${MYSQL_DATABASE:railway}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD}
  sql:
    init:
      mode: never
      encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true

sky:
  jwt:
    secret: ${JWT_SECRET:sky-take-out-local-secret}
    ttl-seconds: ${JWT_TTL_SECONDS:604800}
  admin:
    token: ${ADMIN_TOKEN:yycloveyy}
