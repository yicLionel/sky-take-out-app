name: sky-take-out-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sky-take-out-app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: sky_take_out
      MYSQLUSER: root
      MYSQLPASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: 604800
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: sky-take-out-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sky_take_out
      TZ: Asia/Shanghai
    volumes:
      - sky_mysql_data:/var/lib/mysql
      - ./sky-server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sky-server/src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: sky-take-out-redis
    restart: unless-stopped
    volumes:
      - sky_redis_data:/data

volumes:
  sky_mysql_data:
  sky_redis_data:
